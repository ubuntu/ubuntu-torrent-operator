name: Check charm builds and upload to charmhub if on main branch workflow

on:
  workflow_call:
    secrets:
      CHARMCRAFT_TOKEN:
        required: true

env:
  CHARM_ARTIFACT: ubuntu-torrent-operator_amd64.charm

jobs:
  pack-charm:
    name: Build charm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee

      - name: Install ~~charmcraft~~spread
        run: sudo snap install charmcraft --classic

      - name: Pack charm
        run: charmcraft pack -v

      - name: Upload charm artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.CHARM_ARTIFACT }}
          path: "*.charm"

  test-charm:
    name: Test charm
    needs: pack-charm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee

      - name: Install ~~charmcraft~~spread
        run: sudo snap install charmcraft --classic

      - name: Download charm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.CHARM_ARTIFACT }}
          path: .

      - name: Run charm tests
        run: |
          charmcraft.spread -v tests/

  upload-charm:
    name: Upload charm to charmhub
    needs:
      - pack-charm
      - test-charm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download charm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.CHARM_ARTIFACT }}
          path: .

      - name: Upload charm to charmhub
        uses: canonical/charming-actions/upload-charm@1753e0803f70445132e92acd45c905aba6473225 # 2.7.0
        env:
          CHARMCRAFT_AUTH: '${{ secrets.CHARMCRAFT_TOKEN }}'
        with:
          credentials: '${{ secrets.CHARMCRAFT_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          tag-prefix: ubuntu-torrent-operator
          built-charm-path: ubuntu-torrent-operator_amd64.charm
